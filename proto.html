  金子 <b id="gold">0/0</b> ｜ 生命 <b id="lives">3</b> ｜ 关卡 <b id="lv">1</b><br>
  <span class="k">A</span><span class="k">D</span> 走

  <span class="k">J</span> 挖左下 <span class="k">K</span> 挖右下 <span class="k">L</span> 梯上垂直挖

<div id="foot">v0.5 完整机制集：挖坑埋人+以身填坑 · 悬吊横杆（空中走廊，守卫也会吊杆追击，杆下不可挖=原版护绳规则） · Z轴双层隧道 · 信息不对称谜题。共 5 关，L2/L4/L5 有背面层。</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
/* cell chars: '#'砖(可挖) '='硬砖 '.'通道 '~'空气 'o'坑 ; 叠加: 'l'梯 'b'杆 't'隧道 'G'金 'p' 'e' 'E' */
const LEVELS=[
/* -------- L1 教学：单层挖坑 -------- */
{f:[
"===========E=================",
"#.....l.....#.G...l.....#...#",
"#####.#######.###.#####.#####",
"#..#.G#.l.....#.#...#...#.l.#",
"#.##.#####.##.#.#.#.###.#.#.#",
"#.#....#G.#.#.#...#.#...#.#.#",
"#.#.####.##.#.#####.#.###.#.#",
"#.#....#....#.....#...#...#.e#",
"#.######.#########.####.#####",
"#p.....#.#..G....#....#.....#",
"#.#.##.#.#####.#.#####.#####.",
"#.#.#G...#...#.#.....#.....#.",
"#.#.#####.#.#.#####.#.###.#.#",
"#...#...G.#.#.....#.#.#G#...#",
"#############################",
]},
/* -------- L2 双层隧道 -------- */
{f:[
"============E=================",
"#..G....#G.#l...#..l..#....G.#",
"###.###.####.###.###.###.#####",
"#.#...#.#....#...#...#...#...#",
"#.###.#.####.###.#.#.#.#.###.#",
"#.#p....#G#..l.t.#.#.#.#.....#",
"###.#.##.###.###.###.#.#####.#",
"#...#....#...#.....#.#.#...#.#",
"#.#######.###.#####.#.#.#.#.##",
"#.#G..e.....#...t.....#.#.#..#",
"#.#.#########.#######.#.#.#.##",
"#...#.....G.....#.....#...#..#",
"#############################",
],b:[
"#############################",
"#..#G...#.......#....#..#..#",
"#..#.##.#.#####.#.##.#.#.#.##",
"#..#.#..#.#...#...#..#.#...##",
"#..#.##.#.#.#.#####.##.###.##",
"#..#....#.#.#.....#......#t##",
"#.#####.#.#.#####.#.####.####",
"#.#...#.#.#.#...#.#...#.#...#",
"#.#.#.#.#.#.#.#.#.###.#.#.#.#",
"#.#.#.#...#.#.#.#.....#.#.#.#",
"#t###.#####.#.#######.#.#.#.#",
"#.............#.......#.....#",
"#===========================#",
]},
/* -------- L3 横杆关 -------- */
{f:[
"############E################",
"#.G.....l.......l......l..G.#",
"########.#######.######.#####",
"##.#.......G.#......e....#..#",
"#~bbbbb~~#####bbbbb###bbbb~~#",
"#p.......#####.....###......#",
"####.#####.#####.#####.######",
"#.#...G.#...e.#...G.#...e.#.#",
"##########.#######.##########",
"#...l.........G.......l.....#",
"============================="
]},
/* -------- L4 横杆+双层 -------- */
{f:[
"############E################",
"#..G......l........l.....G..#",
"##########.########.#########",
"#....#..e.....#........#....#",
"#~bbb~~###~bbbb~~####bb~~~~~#",
"#p.....###.....G.####.....t.#",
"######.########.########.####",
"#..#......#.Gt......#...l.e.#",
"#~.~~bbb~~~###~~bbb~~###~~~~#",
"#..........###.......###.G..#",
"#########.#########.#########",
"#...#....l...G#....l....#...#",
"============================="
],b:[
"#############################",
"#.......G.l........lG.......#",
"##########.########.#########",
"#.G..#.........#........#...#",
"#....#......e..#........#...#",
"#.........................tG#",
"#...e.......................#",
"#.........#..t..G...#.......#",
"#.....G......#........#.....#",
"#.....#..........#......G...#",
"#.........#.........#.......#",
"#.........G.................#",
"============================="
]},
/* -------- L5 终关 -------- */
{f:[
"############E################",
"#..G........l............G..#",
"############.################",
"#.....#.........#..e..#.....#",
"#~bbbb~##bbb~#######bbbb~~~~#",
"#p.....##....#######....G...#",
"####.###################.####",
"#.....G...#.l.......#...e...#",
"#~~###bbb~~#####bbb~~~~~~.~~#",
"#..###.....#####.....G......#",
"########.############.#######",
"#.G.....l...#.....e.tl......#",
"============================="
],b:[
"#############################",
"#....G......l..........G....#",
"############.################",
"#.......#.....G...#.........#",
"#..e....#.........#.........#",
"#.......#.........#.....G...#",
"#........G..#...............#",
"#...#...........G...#.....e.#",
"#G..#...............#.......#",
"#...........G...............#",
"#.....#...............#.....#",
"#...................t.......#",
"============================="
]}];
let DW=29,DH=12;
const STEP_T=0.13, REFILL=4.0, ZL=2.1;
let sol,ff,bf,golds,enemies,player,exitCell,holes,levelIdx=0,lives=3,msgT=0,won=false,ladderUp=false,tunnels,HASBACK=false;
function tileW(tx,ty,lz){lz=lz||0;return{x:tx-(DW-1)/2,y:DH-1-ty,z:(0.5-lz)*ZL*2};}
const inb=(x,y)=>x>=0&&x<DW&&y>=0&&y<DH;
const cellS=(x,y)=>inb(x,y)?sol[y][x]:(y>=DH?'#':'~');
const featAt=(x,y,lz)=>inb(x,y)?(lz===1?bf[y][x]:ff[y][x]):null;
const isBar=(x,y,lz)=>inb(x,y)&&sol[y][x]==='~'&&featAt(x,y,lz)==='b';
const solidBelow=(x,y)=>{const c=cellS(x,y+1);return c==='#'||c==='=';};
const holeAt=(x,y)=>cellS(x,y)==='o';
const laneF=(x,y)=>inb(x,y)&&sol[y][x]==='.';
const laneB=(x,y)=>inb(x,y)&&sol[y][x]==='.'&&bf[y][x]!=='#';
const laneAt=(x,y,lz)=>(lz===1?laneB:laneF)(x,y);
function standable(x,y,lz){ // a "lane" cell where one can stand (floor surface at same row in our single-cell model)
  if(!laneAt(x,y,lz))return false;
  if(holeAt(x,y))return false;
  return true; }
function fallTarget(x,fromTy,lz){
  for(let y=fromTy;y<DH;y++){const c=sol[y]?sol[y][x]:'#';
    if(c==='o')return{ty:y,buried:true};
    if(isBar(x,y,lz))return{ty:y,buried:false,catchBar:true};
    if(c==='#'||c==='='){if(featAt(x,y,lz)==='l')return{ty:y,buried:false,shaft:true};
      return{ty:Math.max(fromTy,y-1),buried:false};}}
  return{ty:DH-1,buried:false};}
function mkActor(tx,ty,isP,lz){lz=lz||0;const w=tileW(tx,ty,lz);
  return{tx,ty,lz,px:w.x,py:w.y,pz:w.z,isP,cool:0,fall:null,buried:0,dying:0,gold:0,wait:0,swT:0,hang:false,spawn:[tx,ty,lz],vis:null};}

function loadLevel(i){const L=LEVELS[i];DH=L.f.length;HASBACK=!!L.b;
  sol=[];ff=[];bf=[];golds=[];enemies=[];holes=[];exitCell=null;won=false;ladderUp=false;tunnels=[];
  for(let y=0;y<DH;y++){const row=L.f[y].padEnd(DW,'#'); const brow=(L.b&&L.b[y]?L.b[y]:"").padEnd(DW,'#');
    const s=[],fA=[],bA=[];
    for(let x=0;x<DW;x++){let c=row[x],cb=brow[x],fs=null,bs=null,sc=c;
      if(c==='~')sc='~';
      if(c==='#'||c==='='){s.push(c);fA.push(null);bA.push(null);
        if(cb==='t'){fA[x]='t';tunnels.push([x,y]);}
        continue;}
      if(c==='l'){fs='l';sc='.';}
      if(c==='b'){fs='b';sc='~';}
      if(c==='t'){fs='t';sc='.';tunnels.push([x,y]);}
      if(c==='G'){sc='.';golds.push({tx:x,ty:y,lz:0,taken:false});}
      if(c==='p'){sc='.';player=mkActor(x,y,true,0);}
      if(c==='e'){sc='.';enemies.push(mkActor(x,y,false,0));}
      if(c==='E'){exitCell=[x,y];sc='.';}
      if(cb==='l')bs='l'; if(cb==='b')bs='b'; if(cb==='t'){bs='t';tunnels.push([x,y]);}
      if(cb==='G')golds.push({tx:x,ty:y,lz:1,taken:false});
      if(cb==='p')player=mkActor(x,y,true,1);
      if(cb==='e')enemies.push(mkActor(x,y,false,1));
      s.push(sc);fA.push(fs);bA.push(bs);}
    sol.push(s);ff.push(fA);bf.push(bA);}
  // auto-pair tunnels: front t <-> back t at same (x,y), both must be lanes
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    const ft0=ff[y][x]==='t', bt0=bf[y][x]==='t';
    if(!(sol[y][x]==='.'||sol[y][x]==='~'))continue;
    if(ft0&&!bt0&&bf[y][x]!=='#'&&bf[y][x]!=='='){bf[y][x]='t';}
    else if(bt0&&!ft0&&sol[y][x]==='.'){ff[y][x]='t';}
  }
  tunnels=[];for(let y=0;y<DH;y++)for(let x=0;x<DW;x++)if(ff[y][x]==='t'&&bf[y][x]==='t')tunnels.push([x,y]);
  if(!player)player=mkActor(1,1,true,0);
  DH=sol.length;updateHud();buildWorld();}
/* level validation (dev aid) */
function validateLevel(){const errs=[];
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    if(sol[y][x]==='~'&&ff[y][x]==='b'){ if(y+1<DH&&sol[y+1][x]==='#')errs.push('bar over solid ('+x+','+y+')'); }
    if(sol[y][x]==='.'&&y+1<DH&&sol[y+1][x]==='~'&&!ff[y][x]&&featAt(x,y,1)!=='b'&&!isBar(x,y+1,0)&&!isBar(x,y+1,1)){} }
  return errs;}

/* ================= graphics ================= */
const M={dirt:new THREE.MeshStandardMaterial({color:0x8a5a3b,roughness:.9}),
 hard:new THREE.MeshStandardMaterial({color:0x4a5560,roughness:.8,metalness:.2}),
 hole:new THREE.MeshStandardMaterial({color:0x120d09,roughness:1}),
 top:new THREE.MeshStandardMaterial({color:0x9a6a45,roughness:.9}),
 back:new THREE.MeshStandardMaterial({color:0x33404e,roughness:.9}),
 lad:new THREE.MeshStandardMaterial({color:0x6c8090,roughness:.5,metalness:.5}),
 bar:new THREE.MeshStandardMaterial({color:0xffd23f,emissive:0x7a5500,emissiveIntensity:.7,roughness:.3,metalness:.7}),
 tun:new THREE.MeshStandardMaterial({color:0xff8a3c,emissive:0xa03c00,emissiveIntensity:.8,roughness:.4}),
 gold:new THREE.MeshStandardMaterial({color:0xffd75e,roughness:.2,metalness:.7,emissive:0x886a10,emissiveIntensity:.9}),
 exitOff:new THREE.MeshStandardMaterial({color:0x5a5f66,roughness:.4}),
 exitOn:new THREE.MeshStandardMaterial({color:0x53d76e,emissive:0x2f9e44,emissiveIntensity:.9,roughness:.3}),
 bodyP:new THREE.MeshStandardMaterial({color:0x4f8fdd,roughness:.5}),
 bodyE:new THREE.MeshStandardMaterial({color:0xcf4f3f,roughness:.5}),
 head:new THREE.MeshStandardMaterial({color:0xf0c9a0})};
let scene,cam,renderer,ready=false,worldGrp,actorGrp,goldGrp,exitMesh;
const _m4=new THREE.Matrix4();
function initGfx(){if(ready)return;ready=true;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0f1317);scene.fog=new THREE.Fog(0x0f1317,42,95);
  cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,250);scene.add(cam);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xbfd4e6,0x223044,1.1));
  const d=new THREE.DirectionalLight(0xfff2dd,1.5);d.position.set(-8,24,14);scene.add(d);
  const d2=new THREE.DirectionalLight(0x8fb4ff,.6);d2.position.set(6,10,-18);scene.add(d2);
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});}
function buildWorld(){initGfx();
  if(worldGrp)scene.remove(worldGrp);worldGrp=new THREE.Group();scene.add(worldGrp);
  const BW=new THREE.BoxGeometry(1,1,ZL*2+.06),BW2=new THREE.BoxGeometry(1,1,ZL),TB=new THREE.BoxGeometry(1,.16,ZL*2+.1);
  const dm=new THREE.InstancedMesh(BW,M.dirt,DW*DH),hm=new THREE.InstancedMesh(BW,M.hole,DW*DH),
        km=new THREE.InstancedMesh(BW,M.hard,DW*DH),tp=new THREE.InstancedMesh(TB,M.top,DW*DH),
        bk=new THREE.InstancedMesh(BW2,M.back,DW*DH);
  dm.count=hm.count=km.count=tp.count=bk.count=0;
  const push=(im,x,y,z)=>{if(im.count<im.instanceMatrix.count){_m4.makeTranslation(x,y,z);im.setMatrixAt(im.count++,_m4);}};
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){const w=tileW(x,y,.5);const c=sol[y][x];
    if(c==='#'){push(dm,w.x,w.y,0);}
    else if(c==='='){push(km,w.x,w.y,0);}
    else if(c==='o'){push(hm,w.x,w.y,0);}
    if(c==='.'){push(tp,w.x,w.y+.5,0);}}
  if(HASBACK)for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){if(sol[y][x]==='.'&&bf[y][x]==='#'){const w=tileW(x,y);push(bk,w.x,w.y,-ZL*1.5);}}
  for(const im of[dm,hm,km,tp,bk]){im.instanceMatrix.needsUpdate=true;worldGrp.add(im);}
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    for(const lz of[0,1]){const f=featAt(x,y,lz);if(!f)continue;const w=tileW(x,y,lz);
      if(f==='l'){for(const dx2 of[-.3,.3]){const r=new THREE.Mesh(new THREE.BoxGeometry(.07,1.05,.05),M.lad);r.position.set(w.x,w.y+.5,w.z+(dx2>0?.16:-.16));worldGrp.add(r);}
        for(let r0=0;r0<4;r0++){const g=new THREE.Mesh(new THREE.BoxGeometry(.6,.045,.045),M.lad);g.position.set(w.x,w.y+.25+r0*.2,w.z);worldGrp.add(g);}}
      if(f==='b'&&sol[y][x]==='~'){const c2=new THREE.Mesh(new THREE.BoxGeometry(1.02,.16,.16),M.bar);
        c2.position.set(w.x,w.y+.45,w.z+(lz===0?.15:-.15));worldGrp.add(c2);}
      if(f==='t'){const ring=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.1,20,1,true),M.tun);
        ring.rotation.x=Math.PI/2;ring.position.set(w.x,w.y+.4,w.z+(lz===1?-1:1));worldGrp.add(ring);}}}
  if(exitMesh)scene.remove(exitMesh);
  if(exitCell){const w=tileW(exitCell[0],exitCell[1],0);exitMesh=new THREE.Mesh(new THREE.BoxGeometry(.9,1.5,.4),ladderUp?M.exitOn:M.exitOff);
    exitMesh.position.set(w.x,w.y-.2,ZL+.7);scene.add(exitMesh);}
  buildActors();}
function buildActors(){if(actorGrp)scene.remove(actorGrp);actorGrp=new THREE.Group();scene.add(actorGrp);
  player.vis=vis(M.bodyP);for(const e of enemies)e.vis=vis(M.bodyE);}
function vis(mat){const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.54,.44),mat);b.position.y=.28;g.add(b);
  const h=new THREE.Mesh(new THREE.BoxGeometry(.36,.3,.36),M.head);h.position.y=.72;g.add(h);actorGrp.add(g);return g;}
function syncActors(){const put=a=>{if(!a.vis)return;a.vis.visible=a.dying<=0;
    const w=tileW(a.tx,a.ty,a.lz);a.vis.position.set(a.px,a.py+(a.hang?-.52:0),a.pz);
    a.vis.rotation.z=a.buried>0?1.35:0;a.vis.position.y+=a.buried>0?-.4:0;};
  put(player);for(const e of enemies)put(e);
  if(goldGrp)scene.remove(goldGrp);goldGrp=new THREE.Group();scene.add(goldGrp);
  for(const g of golds){if(g.taken)continue;const w=tileW(g.tx,g.ty,g.lz);const m=new THREE.Mesh(new THREE.BoxGeometry(.46,.2,.3),M.gold);
    m.position.set(w.x,w.y+.12,w.z);m.rotation.y=performance.now()/700;goldGrp.add(m);}}

/* ================= dig / refill / 填坑 ================= */
function dig(x,y){if(!inb(x,y)||sol[y][x]!=='#')return false;
  if(featAt(x,y,0)==='l'||featAt(x,y,1)==='l')return false;                 // 不挖梯井
  if(y>0&&(sol[y-1][x]==='~')&&(featAt(x,y-1,0)==='b'||featAt(x,y-1,1)==='b'))return false; // 杆下不挖（原版护绳规则）
  if(featAt(x,y,0)==='t'||featAt(x,y,1)==='t')return false;                 // 不挖隧道
  sol[y][x]='o';holes.push({x,y,t:0});buildWorld();return true;}
function digSide(a,s){return dig(a.tx+s,a.ty+1);}
function digDown(a){const tx=a.tx,ty=a.ty;
  if(featAt(tx,ty,a.lz)==='l'||featAt(tx,ty+1,a.lz)==='l'){let y=ty+1;
    while(inb(tx,y)&&sol[y][tx]==='o')y++;
    return dig(tx,y);}return false;}
function holeObj(x,y){return holes.find(h=>h.x===x&&h.y===y);}
function updateHoles(dt){let dirty=false;
  for(const h of holes){h.t+=dt;
    for(const a of[player,...enemies]){if(a.buried>0)continue;
      if(a.tx===h.x&&(a.ty===h.y-1||a.ty===h.y-2))h.t+=dt*5;}
    for(const e of enemies){if(e.buried>0&&e.tx===h.x&&e.ty===h.y)h.t+=dt*10;}      // 以身填坑
    if(player.buried>0&&player.tx===h.x&&player.ty===h.y){killPlayer();}
    if(h.t>=REFILL){sol[h.y][h.x]='#';dirty=true;
      for(const a of[player,...enemies]){if(!a.fall&&a.tx===h.x&&a.ty===h.y){
        if(a.isP){a.buried=0;killPlayer();}else{a.buried=Math.min(a.buried||9,1.0);}}}}}
  holes=holes.filter(h=>sol[h.y][h.x]==='o');
  if(dirty)buildWorld();}

/* ================= movement ================= */
function moveTo(a,tx,ty){a.tx=tx;a.ty=ty;const w=tileW(tx,ty,a.lz);a.px=w.x;a.py=w.y;a.pz=w.z;}
function beginFall(a,tx,ty0){const r=fallTarget(tx,ty0,a.lz);
  a.fall={tx,ty0,t:0,to:r.ty,buried:r.buried,catchBar:!!r.catchBar};a.hang=false;a.cool=0;}
function tickFall(a,dt){if(!a.fall)return false;a.fall.t+=dt*7;const k=Math.min(1,a.fall.t);
  const y0=tileW(a.fall.tx,a.fall.ty0,a.lz).y,y1=tileW(a.fall.tx,a.fall.to,a.lz).y;
  a.px=tileW(a.fall.tx,a.fall.to,a.lz).x;a.py=y0+(y1-y0)*(k*(2-k));
  if(k>=1){const f=a.fall;a.fall=null;a.tx=f.tx;a.ty=f.to;moveTo(a,f.tx,f.to);
    if(f.catchBar){a.hang=true;}
    else if(f.buried){a.buried=a.isP?0.6:2.4;if(!a.isP&&a.gold){dropGold(a);a.gold=0;}}}
  return true;}
function walk(a,dx){const tx=a.tx+dx,ty=a.ty;
  if(a.hang){ // moving along bars
    if(isBar(tx,ty,a.lz)){moveTo(a,tx,ty);return true;}
    if(standable(tx,ty,a.lz)){moveTo(a,tx,ty);a.hang=false;return true;} // hop up onto ledge end of bars
    return false;}
  if(cellS(tx,ty)==='#'||cellS(tx,ty)==='='||cellS(tx,ty)==='~'){
    if(isBar(tx,ty,a.lz)){moveTo(a,tx,ty);a.hang=true;return true;}      // grab bars sideways
    return false;}
  if(!laneAt(tx,ty,a.lz))return false;
  if(holeAt(tx,ty+1)){moveTo(a,tx,ty);beginFall(a,tx,ty+1);return true;}
  if(cellS(tx,ty+1)==='~'&&!isBar(tx,ty+1,a.lz)&&featAt(tx,ty,a.lz)!=='l'&&cellS(tx,ty)!=='o'){moveTo(a,tx,ty);beginFall(a,tx,ty);return true;} // 假砖/空心沿口坠落
  moveTo(a,tx,ty);return true;}
function climb(a,dir){const tx=a.tx,ty=a.ty+dir;
  if(!inb(tx,ty)){ if(dir<0&&exitCell&&tx===exitCell[0]&&ladderUp&&a.lz===0){winLevel();return true;} return false;}
  const shaft=featAt(tx,ty,a.lz)==='l'||featAt(tx,a.ty,a.lz)==='l'||isBar(tx,ty,a.lz);
  if(dir<0){
    if(a.hang){ // from bars: up if cell above is standable lane (only legal where bar meets ledge) — or same-col ladder
      const ua=cellS(tx,a.ty-1);
      if((ua==='.'||ua==='o')&&laneAt(tx,a.ty-1,a.lz)){moveTo(a,tx,a.ty-1);a.hang=false;
        if(holeAt(tx,a.ty))beginFall(a,tx,a.ty);
        return true;}
      return false;}
    if(featAt(tx,a.ty,a.lz)==='l'||featAt(tx,ty,a.lz)==='l'){
      if(exitCell&&ty===exitCell[1]&&tx===exitCell[0]&&a.lz===0&&ladderUp){winLevel();return true;}
      moveTo(a,tx,ty);a.cool=.04;return true;}
    if(isBar(tx,ty,a.lz)){moveTo(a,tx,ty);a.hang=true;a.cool=.06;return true;}
    if(isBar(tx,a.ty,a.lz)&&cellS(tx,ty)==='.'){moveTo(a,tx,ty);a.hang=false;a.cool=.06;return true;} // 杆上头顶通道：直接站上去
    return false;}
  // down
  if(featAt(tx,ty,a.lz)==='l'||(shaft&&!a.hang)){
    if(holeAt(tx,ty)&&isBar(tx,ty,a.lz)===false){beginFall(a,tx,ty);return true;}
    moveTo(a,tx,ty);return true;}
  if(isBar(tx,ty,a.lz)){moveTo(a,tx,ty);a.hang=true;return true;}
  return false;}
function jumpDown(a){if(a.hang){a.hang=false;beginFall(a,a.tx,a.ty+1);return true;}
  if(holeAt(a.tx,a.ty+1)){beginFall(a,a.tx,a.ty+1);return true;}
  const below=cellS(a.tx,a.ty+1);
  if(below==='~'&&isBar(a.tx,a.ty+1,a.lz)){moveTo(a,a.tx,a.ty+1);a.hang=true;return true;}
  if(below==='~'){beginFall(a,a.tx,a.ty+1);return true;}
  if(below==='o'){beginFall(a,a.tx,a.ty+1);return true;}
  if(featAt(a.tx,a.ty+1,a.lz)==='l'&&(below==='.'||below==='o')===false&&cellS(a.tx,a.ty+1)==='.'){moveTo(a,a.tx,a.ty+1);return true;}
  return false;}
function switchLayer(a,dir){const tx=a.tx,ty=a.ty;
  const here=featAt(tx,ty,a.lz)==='t',there=featAt(tx,ty,1-a.lz)==='t';
  if(!(here&&there))return false;
  a.lz=1-a.lz;moveTo(a,tx,ty);a.cool=.3;return true;}

/* ================= player ================= */
function tickPlayer(dt){const p=player;
  if(p.dying>0){p.dying-=dt;if(p.dying<=0)respawn(p);return;}
  if(p.buried>0){p.buried-=dt;if(p.buried<=0)killPlayer();return;}
  if(tickFall(p,dt))return;
  if(p.cool>0){p.cool-=dt;return;}
  let acted=false;
  if(keys['a'])acted=walk(p,-1); else if(keys['d'])acted=walk(p,1);
  else if(keys['w'])acted=climb(p,-1); else if(keys['s'])acted=climb(p,1);
  else if(keys[' '])acted=jumpDown(p);
  else if(keys['z'])acted=switchLayer(p,-1); else if(keys['x'])acted=switchLayer(p,1);
  if(jp('j'))acted=digSide(p,-1)||acted; if(jp('k'))acted=digSide(p,1)||acted; if(jp('l'))acted=digDown(p)||acted;
  if(acted)p.cool=STEP_T;
  collect(p);
  for(const e of enemies){if(e.buried>0||e.dying>0)continue;
    if(e.lz===p.lz&&Math.abs(e.px-p.px)<.55&&Math.abs(e.py-p.py)<.8){killPlayer();break;}}
  if(ladderUp&&exitCell&&p.tx===exitCell[0]&&p.ty<=exitCell[1]+1&&p.lz===0){winLevel();}
  updateLayerHud();}
function collect(a){for(const g of golds){if(!g.taken&&g.tx===a.tx&&g.ty===a.ty&&g.lz===(a.lz||0)){
  if(a.isP){g.taken=true;flash('金子 +1');updateHud();
    if(golds.every(x=>x.taken)&&!ladderUp){ladderUp=true;openExit();showMsg('全部金子！出口通天梯已打开 — 回前层爬向顶部的 E',2.6);}}
  else if(!a.gold){g.taken=true;a.gold=1;updateHud();}}}}
function openExit(){if(!exitCell)return;const x=exitCell[0];
  for(let y=exitCell[1]+1;y<DH;y++){
    if(sol[y][x]==='#'||sol[y][x]==='o'||sol[y][x]==='='){sol[y][x]='.';}
    if((sol[y][x]==='.'||sol[y][x]==='~')&&ff[y][x]===null){ff[y][x]='l';}}
  holes=holes.filter(h=>h.x!==x);buildWorld();}
function dropGold(a){for(let y=a.ty;y<DH;y++){if(sol[y]&&(sol[y][a.tx]==='.'||sol[y][a.tx]==='~')){golds.push({tx:a.tx,ty:y,lz:a.lz,taken:false});updateHud();return;}}}
function killPlayer(){if(player.dying>0)return;lives--;updateHud();
  if(lives<=0){showMsg('GAME OVER · 按 R 重来',1e9);player.dying=1e9;return;}player.dying=.5;}
function respawn(a){a.dying=0;a.buried=0;a.fall=null;a.hang=false;const[x,y,z]=a.spawn;a.lz=z;moveTo(a,x,y);}
function winLevel(){if(won)return;won=true;
  if(levelIdx+1<LEVELS.length){levelIdx++;
    const tips={1:'L2：背面藏金 — 转镜头(E)找橙色隧道口，Z/X 穿墙',2:'L3：金色横杆=空中走廊。守卫上不了杆！',3:'L4：杆上走廊 + 背面隧道，组合考试',4:'L5：终关。信息不对称的完全体'};
    showMsg('过关！'+(tips[levelIdx]||''),3);setTimeout(()=>{document.getElementById('msg').style.display='none';loadLevel(levelIdx);},1300);}
  else showMsg('🏆 五关全通 — 机制集验证完毕：可以开始正式设计了',1e9);}

/* ================= enemy AI ================= */
function tickEnemies(dt){for(const e of enemies){
  if(e.buried>0){e.buried-=dt;if(e.buried<=0)respawn(e);continue;}
  if(tickFall(e,dt))continue;
  if(e.dying>0)continue;
  if(e.lz!==player.lz){const tn=tunnelTarget(e);
    if(tn){const[tx2,ty2]=tn;
      if(e.tx===tx2&&e.ty===ty2){e.swT=(e.swT||0)+dt;if(e.swT>.4){e.swT=0;switchLayer(e,player.lz>0?1:-1);}continue;}
      e.swT=0;
      let mv=eV(e,ty2>e.ty?1:-1)||eH(e,tx2>e.tx?1:-1)||eH(e,tx2<e.tx?-1:1)||eV(e,ty2<e.ty?-1:1);
      if(!mv)e.wait=.2;continue;}}
  if(e.wait>0){e.wait-=dt;continue;}
  const[px,py]=[player.tx,player.ty],[tx,ty]=[e.tx,e.ty];
  let mv=false;
  if(py>ty){ if(holeAt(tx,ty+1)){beginFall(e,tx,ty+1);mv=true;}
    else if(cellS(tx,ty+1)==='~'){if(isBar(tx,ty+1,e.lz)){/*bars block guards*/ mv=eH(e,px>tx?1:-1)||eH(e,-(px>tx?1:-1));}
      else{beginFall(e,tx,ty+1);mv=true;}}
    else if(!solidBelow(tx,ty)&&laneAt(tx,ty+1,e.lz)&&px===tx){beginFall(e,tx,ty);mv=true;}
    else mv=eH(e,(px>tx?1:-1))||eH(e,-(px>tx?1:-1)); }
  else if(py<ty){ mv=eV(e,-1); if(!mv){const lc=nearestLadder(tx,ty,e.lz);mv=eH(e,(lc>tx?1:-1))||eH(e,(px>tx?1:-1));} }
  else mv=eH(e,px>tx?1:-1)||eH(e,px<tx?-1:1);
  const fut=holeObj(e.tx+(px>e.tx?1:px<e.tx?-1:0),e.ty+1);
  if(fut&&fut.t<2.2&&!e._probe){e._probe=1;e.wait=.25;} if(!fut)e._probe=0;
  if(!mv)e.wait=.18;
  collect(e);
  if(e.lz===player.lz&&!player.fall&&player.buried<=0&&player.dying<=0&&!player.hang&&Math.abs(e.px-player.px)<.55&&Math.abs(e.py-player.py)<.8)killPlayer();
}}
function eH(e,d){if(!d)return false;const nx=e.tx+(d>0?1:-1);
  if(e.hang){
    if(isBar(nx,e.ty,e.lz)){moveTo(e,nx,e.ty);return true;}
    if(cellS(nx,e.ty)==='.'&&laneAt(nx,e.ty,e.lz)){moveTo(e,nx,e.ty);e.hang=false;return true;} // rope end -> up onto ledge
    return false;}
  if(isBar(nx,e.ty,e.lz)){moveTo(e,nx,e.ty);e.hang=true;return true;}   // guards use bars too (1983-faithful)
  const c=cellS(nx,e.ty);
  if(c==='~'||c==='#'||c==='=')return false;
  if(laneAt(nx,e.ty,e.lz)){ if(holeAt(nx,e.ty+1)){moveTo(e,nx,e.ty);beginFall(e,nx,e.ty+1);return true;}
    if(cellS(nx,e.ty+1)==='~'&&!isBar(nx,e.ty+1,e.lz)){moveTo(e,nx,e.ty);beginFall(e,nx,e.ty);return true;}
    if(holeAt(nx,e.ty)){beginFall(e,nx,e.ty);return true;}
    moveTo(e,nx,e.ty);return true;}
  return false;}
function eV(e,dir){const ny=e.ty+dir;
  if(!inb(e.tx,ny))return false;
  const shaft=featAt(e.tx,ny,e.lz)==='l'||featAt(e.tx,e.ty,e.lz)==='l';
  if(!shaft)return false;
  if(cellS(e.tx,ny)==='~'){if(isBar(e.tx,ny,e.lz)){moveTo(e,e.tx,ny);e.hang=true;return true;}return false;}
  if(cellS(e.tx,ny)==='=')return false;
  if(laneAt(e.tx,ny,e.lz)){if(holeAt(e.tx,ny+1)){beginFall(e,e.tx,ny+1);return true;}moveTo(e,e.tx,ny);return true;}
  return false;}
function nearestLadder(tx,ty,lz){for(let s=0;s<12;s++){for(const c of[tx+s,tx-s]){
    if(inb(c,ty)&&(featAt(c,ty,lz)==='l'||featAt(c,ty+1,lz)==='l'))return c;}}return tx;}
function tunnelTarget(e){let best=null,bd=1e9;
  for(const[x,y]of tunnels){if(featAt(x,y,e.lz)==='t'&&featAt(x,y,1-e.lz)==='t'){
    const d=Math.abs(x-e.tx)+Math.abs(y-e.ty);if(d<bd){bd=d;best=[x,y];}}}
  return best;}

/* ================= input/hud/cam ================= */
let keys={},jpk={};
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();keys[k]=true;jpk[k]=true;
  if([' '].includes(ev.key))ev.preventDefault();
  if(k==='r'){lives=3;levelIdx=0;document.getElementById('msg').style.display='none';loadLevel(0);}});
addEventListener('keyup',ev=>{keys[ev.key.toLowerCase()]=false;});
function jp(k){if(jpk[k]){jpk[k]=false;return true;}return false;}
function updateHud(){document.getElementById('gold').textContent=golds.filter(g=>g.taken).length+"/"+golds.length;
  document.getElementById('lives').textContent=lives;document.getElementById('lv').textContent=levelIdx+1;}
function updateLayerHud(){const hasBack=!!LEVELS[levelIdx].b;
  document.getElementById('layr').textContent=hasBack?(player.lz===1?'后层 ◀ Z':'前层 X ▶ 隧道'):(player.hang?'吊杆上':'前层');}
function showMsg(s,t){const m=document.getElementById('msg');m.textContent=s;m.style.display='block';msgT=t;}
function flash(s){if(msgT>3)return;showMsg(s,.9);}
let camYaw=0;const camPitch=.42,camDist=37;
function tickCam(dt){if(keys['q'])camYaw-=1.5*dt;if(keys['e'])camYaw+=1.5*dt;camYaw=Math.max(-1.25,Math.min(1.25,camYaw));
  const cy=(DH-1)*.5;
  const fx=player.px*0.32, fy=player.py*0.28;            // follow the player a bit
  const cx=fx+Math.sin(camYaw)*camDist*Math.cos(camPitch);
  const cy2=cy+fy*.5+camDist*Math.sin(camPitch)*.75;
  const cz=fx*0.1+Math.cos(camYaw)*camDist*Math.cos(camPitch);
  cam.position.set(cx,cy2,cz);
  cam.lookAt(fx,cy*.92+fy*.3,0);}
let prev=performance.now();
function loop(t){const dt=Math.min(.05,(t-prev)/1000);prev=t;
  tickPlayer(dt);tickEnemies(dt);updateHoles(dt);tickCam(dt);syncActors();
  if(msgT>0){msgT-=dt;if(msgT<=0)document.getElementById('msg').style.display='none';}
  renderer.render(scene,cam);requestAnimationFrame(loop);}
loadLevel(0);showMsg('v0.5：五关完整机制集。K 挖右下砖埋守卫开始！',3.2);
requestAnimationFrame(loop);
</script>
