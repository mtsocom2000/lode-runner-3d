<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Lode Runner 3D — v0.6 地平面场景（45°俯瞰 + X光透视）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8ecef;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  #hud{position:fixed;top:12px;left:14px;color:#2a3138;font-size:13px;line-height:1.9;z-index:2;user-select:none;
    background:rgba(255,255,255,.75);padding:10px 14px;border-radius:8px;backdrop-filter:blur(6px)}
  #hud b{color:#000}
  .k{display:inline-block;background:#dfe5ea;border:1px solid #b8c2cc;border-radius:4px;padding:0 6px;font-family:monospace;color:#1a56c4;margin-right:2px}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#12181e;font-size:20px;font-weight:600;
    z-index:3;display:none;background:rgba(255,255,255,.9);padding:14px 26px;border-radius:10px;border:1px solid #b8c2cc}
  #foot{position:fixed;bottom:10px;left:14px;color:#5a6a78;font-size:12px;z-index:2}
</style>
</head>
<body>
<div id="hud">
  <b>LODE RUNNER 3D · v0.6 地平面原型</b><br>
  金 <b id="gold">0/0</b> ｜ 挖剩 <b id="dug">0</b><br>
  <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> 走（自动上/下一级台阶，太高挡住）
  <span class="k">J</span><span class="k">K</span> 挖左/右柱顶<br>
  <span class="k">Q</span><span class="k">E</span> 绕角色旋转镜头 ｜ <span class="k">↑</span><span class="k">↓</span> 俯角 ｜ <span class="k">滚轮</span> 拉近 ｜ <span class="k">R</span> 重置
</div>
<div id="msg"></div>
<div id="foot">切片验证：① 45° 俯瞰全域可见 ② 相机→角色连线上的方块自动半透明（X光） ③ 挖柱顶→4s 回填 ④ 高度可走性。确认方向后移植全部机制（埋人/金/出口/双层）。</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
/* ================= map: from generator (heights 0..3 per cell, 'X'stone=不可挖 简化先不做, G金 e敌 p出生 E出口) ========= */
const MAP=[
"...........................",
"...11.1......E.....G3.1.1.",
".....212...........2.1111.",
"....313............3G3.1.",
"..12................1..G.",
"...2.2..1...........e.1.1.",
".....G311.........1..3..2.",
".....11.1........21212...",
"...3.11.1.......1.2........".slice(0,27),
"....1.1.........1...111...",
"...1.132.G......2.121.1...",
".12.31.............23.33.2",
".1..e.1............12.G221",
".1..2..............2..1...",
"...11..1............2...2.",
".............p............",
"...........................",
];
const W=27, D=MAP.length, REFILL=4.0;
let H=[], golds=[], guards=[], player, exitC;
function loadMap(){
  H=MAP.map(r=>[...r].map(c=>+c||0)); golds=[];guards=[];exitC=null;
  MAP.forEach((r,y)=>[...r].forEach((c,x)=>{
    if(c==='G'){golds.push({x,y,taken:false});H[y][x]=Math.max(1,H[y][x]);}
    if(c==='e'){guards.push({x,y,vx:x,vy:y,t:0});H[y][x]=Math.max(1,H[y][x]);}
    if(c==='p'){player={x,y,vx:x,vy:0,fx:x,fy:y};}
    if(c==='E'){exitC={x,y};H[y][x]=0;}
  }));
  holes=[];dugCount=0;updateHud();rebuild();
}
let holes=[] /* {x,y,t} 挖掉的格子(临时高度-1) */, dugCount=0;
function hAt(x,y){ if(x<0||y<0||x>=W||y>=D)return 0; let h=H[y][x];
  const ho=holes.find(o=>o.x===x&&o.y===y); if(ho)h-=1; return Math.max(0,h); }
function stoneTop(x,y){ /* 简化：高度3的顶不可挖(演示用) */ return hAt(x,y)>=3; }
function dig(x,y){ if(x<0||y<0||x>=W||y>=D)return false;
  const ho=holes.find(o=>o.x===x&&o.y===y); if(ho)return false;
  if(H[y][x]-((ho)?1:0)<1||stoneTop(x,y))return false;
  holes.push({x,y,t:0});dugCount++;rebuild();return true;}
function updateHoles(dt){ let dirty=false;
  for(const o of holes){o.t+=dt;
    if(Math.abs(player.fx-o.x)<.6&&Math.abs(player.fy-o.y)<.6)o.t+=dt*4;   // 走上空位加速回填
    if(o.t>=REFILL){holes.splice(holes.indexOf(o),1);dirty=true;break;}}
  if(dirty)rebuild(); }
/* ================= three ================= */
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe8ecef);
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8c4cc,1.15));
const sun=new THREE.DirectionalLight(0xfff6e0,1.2);sun.position.set(-10,22,8);scene.add(sun);
/* soft ground */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(W+8,D+8),new THREE.MeshLambertMaterial({color:0xf0efe9}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.01;scene.add(ground);
const grid=new THREE.GridHelper(Math.max(W,D)+6,Math.max(W,D)+6,0xd8d5cc,0xd8d5cc);
grid.position.y=0.01;scene.add(grid);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;
sun.shadow.camera.near=1;sun.shadow.camera.far=80; sun.shadow.bias=-0.0015;
ground.receiveShadow=true;
let camDist=34,camPitch=.86,camYaw=0;   // ~45° overhead: pitch .86 ≈ 49°, user can tune
addEventListener('wheel',ev=>{camDist=Math.max(14,Math.min(60,camDist+ev.deltaY*.03));});
function cx(x){return x-(W-1)/2;} function cz(y){return y-(D-1)/2;}
/* cube pool: reuse meshes with materials so transparency switching is cheap */
let world=new THREE.Group();scene.add(world);
/* ---------- toon kit: 3-step gradient + ink edges ---------- */
const g3=new Uint8Array([100,100,100,255, 190,190,190,255, 255,255,255,255]);
const grad=new THREE.DataTexture(g3,3,1,THREE.RGBAFormat);
grad.needsUpdate=true;grad.minFilter=grad.magFilter=THREE.NearestFilter;
const toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad});
const INK=0x2b3036;
const lineMat=new THREE.LineBasicMaterial({color:INK});
const lineMatX=new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:.22});
/* palette: 参考图马卡龙建筑色（墙面）+ 白色屋顶 */
const PALETTE=[0x9ec87f,0xf0cf6b,0xe8956a,0xbdd7e6,0xd9a6c0].map(toon);
const ROOF=toon(0xf7f4ee);
const MAT={xray:new THREE.MeshBasicMaterial({color:0xcfd6dd,transparent:true,opacity:.16,depthWrite:false}),
 gold:toon(0xffc93c), goldX:new THREE.MeshBasicMaterial({color:0xffc93c,transparent:true,opacity:.3,depthWrite:false}),
 p:toon(0x3f7fd8), e:toon(0xd04a34), E:toon(0x3fae58)};
function addEdges(geo,parent){const eg=new THREE.LineSegments(new THREE.EdgesGeometry(parent.geometry||geo,30),lineMat);
  parent.add(eg);return eg;}
let cubes=[] /* {mesh,cap,edges,capEdges,x,y,top,gold?} */;
function colMat(x,y){return PALETTE[(x*7+y*13)%PALETTE.length];}
function rebuild(){
  for(const c of cubes){world.remove(c.mesh);if(c.cap)world.remove(c.cap);}
  cubes=[];
  for(let y=0;y<D;y++)for(let x=0;x<W;x++){
    const top=hAt(x,y); if(!top)continue;
    const wallG=new THREE.BoxGeometry(.98,top-.14,.98);
    const m=new THREE.Mesh(wallG,colMat(x,y));
    m.position.set(cx(x), (top-.14)/2, cz(y)); m.castShadow=true;
    world.add(m); addEdges(wallG,m);
    const capG=new THREE.BoxGeometry(1.04,.14,1.04);
    const cap=new THREE.Mesh(capG,ROOF);
    cap.position.set(cx(x), top-.07, cz(y)); cap.castShadow=true;
    world.add(cap); addEdges(capG,cap);
    m.userData.baseMat=m.material; cap.userData.baseMat=cap.material;
    const rec={mesh:m,cap,x,y,top}; cubes.push(rec);
    for(const g of golds){ if(!g.taken&&g.x===x&&g.y===y){
      const gg=new THREE.BoxGeometry(.44,.44,.44);
      const gm=new THREE.Mesh(gg,MAT.gold);
      gm.position.set(cx(x),top+.34,cz(y));gm.rotation.y=.78;gm.castShadow=true;
      world.add(gm); addEdges(gg,gm);
      cubes.push({mesh:gm,x,y,top,gold:true}); } }
  }
  if(exitC){ const g2=new THREE.BoxGeometry(.8,1.2,.8);
    const em=new THREE.Mesh(g2,MAT.E);em.position.set(cx(exitC.x),.6,cz(exitC.y));
    world.add(em);addEdges(g2,em);cubes.push({mesh:em,x:exitC.x,y:exitC.y,top:0,exit:true}); }
}
function mkActor(g,color){const m=new THREE.Mesh(g,color);m.castShadow=true;addEdges(g,m);return m;}
const pVis=mkActor(new THREE.BoxGeometry(.5,.72,.5),MAT.p);pVis.position.y=.35;scene.add(pVis);
const eVis=[];for(let i=0;i<4;i++){const m=mkActor(new THREE.BoxGeometry(.5,.62,.5),MAT.e);m.visible=false;scene.add(m);eVis.push(m);}
/* ================= movement on heights ================= */
const keys={};
addEventListener('keydown',ev=>{keys[ev.key.toLowerCase()]=true;
  if([' ','arrowup','arrowdown'].includes(ev.key))ev.preventDefault();
  if(keys['r']){loadMap();}
  if(keys['j'])tryDig(-1); if(keys['k'])tryDig(1);});
addEventListener('keyup',ev=>{keys[ev.key.toLowerCase()]=false;});
function tryDig(dx){ const x=player.x+dx, y=player.y; if(x<0||y<0||x>=W||y>=D)return;
  if(dig(x,y))flashMsg('挖掉 ('+x+','+y+') 的柱顶'); }
function tryMove(dx,dy){ const nx=player.x+dx, ny=player.y+dy;
  if(nx<0||ny<0||nx>=W||ny>=D)return false;
  if(hAt(nx,ny)===0&&nx===exitC.x&&ny===exitC.y){win();return false;}
  const dh=hAt(nx,ny)-hAt(player.x,player.y);
  if(dh<=1){ player.x=nx;player.y=ny; return true;}   // 走平 / 下一格(坠落感靠插值) / 上一级台阶
  return false;}
let moveT=0;
function tickPlayer(dt){
  const sp=3.2; let moved=false;
  // screen-relative WASD given camera yaw quarter-snapping:
  const yaw4=Math.round(camYaw/(Math.PI/2))*Math.PI/2;
  const fx=Math.sin(yaw4), fz=Math.cos(yaw4);
  let ix=0,iz=0;
  if(keys['a'])ix-=1; if(keys['d'])ix+=1; if(keys['w'])iz+=1; if(keys['s'])iz-=1;
  // rotate input into world space
  const wx= ix*  fz - iz*fx, wz= iz*fz + ix*fx;   // yaw-4 multiples => axis swap simple
  if(Math.abs(wx)>=Math.abs(wz)){ if(wx<0)moved=tryMove(-1,0); else if(wx>0)moved=tryMove(1,0); }
  else { if(wz<0)moved=tryMove(0,-1); else if(wz>0)moved=tryMove(0,1); }
  const t=Math.min(1,dt*10);
  player.fx+= (player.x-player.fx)*t; player.fy+=(player.y-player.fy)*t;
  pVis.position.set(cx(player.fx), .35+hAt(player.x,player.y), cz(player.fy));
}
/* ================= enemy: 贪心逼近 + 掉坑 ================= */
function tickEnemies(dt){ guards.forEach((g,i)=>{
  eVis[i].visible=true;
  const dh=(g.vy>player.fy)?1:((g.vy<player.fy)?-1:0);
  const dw=(g.vx>player.fx)?1:((g.vx<player.fx)?-1:0);
  let sx=dw, sy=dh; if(Math.abs(g.vx-player.fx)<Math.abs(g.vy-player.fy)){sx=0;}else{sy=0;}
  const nx=g.x+(sx||0), ny=g.y+(sy||0);
  if(sx||sy){ if(nx>=0&&ny>=0&&nx<W&&ny<D){ const dH=hAt(nx,ny)-hAt(g.x,g.y);
      if(dH<=1){ g.x=nx;g.y=ny; g.hole=hAt(g.x,g.y)===0&&holes.find(o=>o.x===nx&&o.y===ny); }
      else { /* 绕不过的高柱：换轴试 */ 
        const ax=sx?0:dw, az=sx?dh:0; const mx=g.x+ax,my=g.y+az;
        if(mx>=0&&my>=0&&mx<W&&my<D&&hAt(mx,my)-hAt(g.x,g.y)<=1){g.x=mx;g.y=my;} } } }
  const tt=Math.min(1,dt*8);
  g.vx+= (g.x-g.vx)*tt; g.vy+=(g.y-g.vy)*tt;
  eVis[i].position.set(cx(g.vx),.3+hAt(g.x,g.y),cz(g.vy));
});}
/* ================= X-ray: 相机→角色线段 穿过的方块半透明（slab test, 确定性） ================= */
function segAABB(px,py,pz, dx,dy,dz, hx,hy,hz, r){  // segment p->p+d vs AABB center h halfsize r
  let tmin=0,tmax=1;
  for(const [p,d,HH] of [[px,dx,hx],[py,dy,hy],[pz,dz,hz]]){
    let t1,t2;
    if(Math.abs(d)<1e-9){ if(Math.abs(p-HH)>r)return false; else continue; }
    t1=(HH-r-p)/d; t2=(HH+r-p)/d;
    if(t1>t2){const s=t1;t1=t2;t2=s;}
    tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2);
    if(tmin>tmax)return false;
  }
  return true;
}
function setGhost(c,want){
  const dim=c.gold?(want?MAT.goldX:MAT.gold):want?MAT.xray:c.mesh.userData.baseMat;
  c.mesh.material=dim;
  if(c.mesh.children[0])c.mesh.children[0].material=want&&!c.gold?lineMatX:lineMat;
  if(c.cap){ c.cap.material=want?MAT.xray:c.cap.userData.baseMat;
    if(c.cap.children[0])c.cap.children[0].material=want?lineMatX:lineMat; }
}
function xray(){
  const from=cam.position, to=pVis.position;
  const dx=to.x-from.x, dy=to.y-from.y, dz=to.z-from.z;
  for(const c of cubes){
    const P=c.mesh.position;
    const want = c.gold ? segAABB(from.x,from.y,from.z,dx,dy,dz,P.x,P.y,P.z,.45)
                        : segAABB(from.x,from.y,from.z,dx,dy,dz,P.x,P.y,P.z,.72);
    setGhost(c,want);
  }
}
/* ================= camera orbit around player ================= */
function tickCam(dt){
  if(keys['q'])camYaw-=1.2*dt; if(keys['e'])camYaw+=1.2*dt;
  if(keys['arrowup'])camPitch=Math.min(1.5,camPitch+.7*dt);
  if(keys['arrowdown'])camPitch=Math.max(.3,camPitch-.7*dt);
  const t=pVis.position;
  cam.position.set(t.x+Math.sin(camYaw)*camDist*Math.cos(camPitch),
                   t.y+camDist*Math.sin(camPitch),
                   t.z+Math.cos(camYaw)*camDist*Math.cos(camPitch));
  cam.lookAt(t);
}
/* ================= misc ================= */
function updateHud(){document.getElementById('gold').textContent=golds.filter(g=>g.taken).length+"/"+golds.length;
  document.getElementById('dug').textContent=dugCount;}
let msgT=0;function flashMsg(s){document.getElementById('msg').textContent=s;document.getElementById('msg').style.display='block';msgT=1.4;}
function win(){flashMsg('🏆 走到出口（机制移植下一轮：埋人/回填杀/金全收）',6);}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
/* gold pickup by proximity to top surface */
function tickGold(){ for(const g of golds){ if(!g.taken&&player.x===g.x&&player.y===g.y){g.taken=true;flashMsg('金 +1');rebuild();updateHud();} } }
let prev=performance.now();
function loop(t){ const dt=Math.min(.05,(t-prev)/1000);prev=t;
  tickPlayer(dt);tickEnemies(dt);updateHoles(dt);tickGold();tickCam(dt);xray();
  if(msgT>0){msgT-=dt;if(msgT<=0)document.getElementById('msg').style.display='none';}
  renderer.render(scene,cam);requestAnimationFrame(loop);}
loadMap();requestAnimationFrame(loop);
</script>
</body>
</html>
